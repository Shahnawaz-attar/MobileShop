<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #fafafa;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        text-align: center;
        max-width: 360px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        color: #a3a3a3;
        margin: 0 0 16px;
        line-height: 1.5;
      }
      .info {
        background: #1a1a1a;
        border-radius: 12px;
        padding: 16px;
        text-align: left;
        font-size: 0.9rem;
        line-height: 1.6;
      }
      .info div {
        color: #e5e5e5;
      }
      .info span {
        color: #a3a3a3;
        display: block;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Check your connection and try again. You can still reach us here:</p>
      <div class="info">
        <div>Shree Mobiles</div>
        <span>+91 98765 43210</span>
        <span>Shop No. 12, Main Road, Ranibennur</span>
      </div>
    </div>
  </body>
</html>
